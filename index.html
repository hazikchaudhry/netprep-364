 min(7, 3+3) = 6, with predecessor w.`,`calc`),$(`nc-linkstate`,`What is the time complexity of the basic Dijkstra implementation on n nodes?`,[`O(n)`,`O(n log n)`,`O(n²)`,`O(2ⁿ)`],2,`Each iteration scans all nodes not in N′: n(n+1)/2 comparisons = O(n²). Better implementations reach O(n log n).`),$(`nc-linkstate`,`Oscillations in link-state routing are possible when…`,[`link cost equals the amount of traffic carried`,`the network has more than 15 hops`,`nodes use poisoned reverse`,`routers run BGP`],0,`If cost depends on carried traffic, moving traffic changes the costs and routes can flip back and forth.`),$(`nc-linkstate`,`In Dijkstra’s algorithm, what does p(v) represent?`,[`The probability that v is reachable`,`The predecessor of v on the path from the source`,`The port used to reach v`,`The packet count through v`],1,`p(v) is the predecessor node along the path from the source to v. Tracing predecessors builds the shortest-path tree.`),$(`nc-linkstate`,`Problem sheet Q2: shortest distances from z are w = 7 and v = 16 (reached via w). What is the cost of link v–w?`,[`16`,`23`,`9`,`n/a`],2,`16 = 7 + c(v,w), so c(v,w) = 9.`,`calc`),$(`nc-dv`,`Bellman-Ford is used in which one of the following protocols?`,[`Open Shortest Path First`,`External Border Gateway Protocol`,`Link-State`,`Routing Information Protocol`,`Dijkstra’s path`],3,`RIP is a distance-vector protocol built on the Bellman-Ford equation.`,`past`),$(`nc-dv`,`When does the distance vector algorithm finish calculating costs?`,[`When all nodes in the graph are known`,`When the lowest cost path is calculated`,`When the number of iterations reaches the limit set by the administrator`,`When there are no more distance vector changes to process`,`When a route to all nodes has been calculated`],3,`Nodes only send updates when their DV changes. When nothing changes any more, the algorithm has converged.`,`past`),$(`nc-dv`,`Slide 36: c(u,v)=2, c(u,x)=1, c(u,w)=5 and d_v(z)=5, d_x(z)=3, d_w(z)=3. What is d_u(z)?`,[`7`,`8`,`4`,`3`],2,`min{2+5, 1+3, 5+3} = min{7, 4, 8} = 4 (via x).`,`calc`),$(`nc-dv`,`Problem sheet Q3 (u–v 4, v–w 9, v–x 7, w–x 2, x–y 7). After the first exchange (t1), what is u’s cost to w?`,[`9`,`13`,`11`,`∞`],1,`u’s only neighbour is v: 4 + D_v(w) = 4 + 9 = 13.`,`calc`),$(`nc-dv`,`In the same network, once converged, what is u’s cost to y?`,[`14`,`16`,`18`,`20`],2,`u→v→x→y = 4 + 7 + 7 = 18.`,`calc`),$(`nc-dv`,`What is the name of the problem that can occur in distance vector routing when link costs increase?`,[`Count to infinity`,`Oscillation`,`Flooding`,`Hot potato`],0,`Bad news travels slowly: nodes bounce the cost up one step at a time (“count to infinity”).`),$(`nc-dv`,`With poisoned reverse, if Z routes through Y to get to X, then Z tells Y that…`,[`its distance to X is zero`,`its distance to X is infinite`,`the link Y–Z has failed`,`X is unreachable for everyone`],1,`Z advertises an infinite distance to X to Y, so Y never routes to X via Z, preventing the loop.`),$(`nc-dv`,`“Good news travels fast, bad news travels slow” describes…`,[`BGP route selection`,`link cost decreases propagating quickly but increases propagating slowly in DV`,`TCP congestion control`,`how OSPF floods link-state ads`],1,`A decrease spreads in a couple of rounds; an increase can take many rounds (count to infinity).`),$(`nc-dv`,`In distance-vector routing, when does a node notify its neighbours?`,[`Only when its own DV changes (as well as from time to time)`,`Every millisecond`,`Only when the administrator asks`,`Only when a link fails`],0,`DV is iterative, asynchronous and distributed: each node notifies neighbours only when its DV changes.`),$(`nc-dv`,`Which statement about robustness is correct?`,[`In LS, errors spread through the whole network`,`In DV, an incorrect path cost advertised by one node can propagate through the network`,`In DV each node computes only its own table from the full topology`,`LS and DV are equally robust`],1,`DV tables are used by other nodes, so errors propagate. In LS each node computes only its own table.`),$(`nc-dv`,`Poisoned reverse cannot solve…`,[`loops involving more than three nodes`,`good-news propagation`,`two-node loops`,`the need for neighbours`],0,`The slides: it solves most count-to-infinity problems but cannot deal with cases involving more than three neighbours/nodes.`),$(`nc-hier`,`Why are routers grouped into autonomous systems?`,[`Because routers can’t run Dijkstra`,`For scale and administrative autonomy`,`To avoid using IP addresses`,`Because BGP requires exactly three ASes`],1,`Billions of destinations can’t be stored/exchanged flat, and each network admin wants control over routing in their own network.`),$(`nc-hier`,`A gateway router is…`,[`any router with more than two links`,`a router at the edge of its AS with link(s) to router(s) in another AS`,`the router that runs Dijkstra`,`a switch that connects VLANs`],1,`Gateways sit at the AS edge and perform inter-domain routing as well as intra-domain routing.`),$(`nc-hier`,`Intra-AS routing determines forwarding-table entries for…`,[`all Internet destinations`,`destinations within the AS`,`only other ASes`,`MAC addresses`],1,`Intra-AS fills entries for destinations inside the AS; intra- plus inter-AS together handle external destinations.`),$(`nc-hier`,`RIP uses which metric?`,[`Link bandwidth`,`Delay in ms`,`Hop count, maximum 15`,`AS-PATH length`],2,`RIP: distance vector, hop count (each link cost 1, max 15), DVs exchanged with neighbours every 30 s.`),$(`nc-hier`,`OSPF messages are carried…`,[`over TCP`,`over UDP`,`directly over IP`,`over Ethernet only`],2,`OSPF messages go directly over IP, not TCP or UDP.`),$(`nc-hier`,`In a hierarchical OSPF network, what is the purpose of the area border routers?`,[`To link together autonomous systems`,`To generate a forwarding table of all nodes in an area`,`To prevent malicious users from changing settings`,`To summarize distances to nets in own area`,`To limit traffic to within the backbone`],3,`Area border routers summarise distances to nets in their own area and advertise that to other area border routers.`,`past`),$(`nc-hier`,`Which statement about OSPF is true?`,[`It can only use one path to each destination`,`Its messages can be authenticated`,`It is a distance-vector protocol`,`It limits paths to 15 hops`],1,`OSPF messages can be authenticated, it allows multiple same-cost paths, and supports hierarchy. It is link state.`),$(`nc-hier`,`Which intra-AS protocol is “nearly identical to OSPF”?`,[`RIP`,`IGRP`,`IS-IS`,`BGP`],2,`IS-IS (intermediate system to intermediate system) is nearly identical to OSPF.`),$(`nc-bgp`,`What does eBGP transmit messages between?`,[`Backbone routers of neighbouring autonomous systems`,`Adjacent gateway routers of an autonomous system`,`Gateway routers of neighbouring autonomous systems`,`Adjacent backbone routers of an autonomous system`,`All routers within an autonomous system`],2,`eBGP runs between gateway routers of neighbouring ASes. iBGP spreads the information inside an AS.`,`past`),$(`nc-bgp`,`What is the role of policy within BGP?`,[`Securing gateway routers`,`Setting the number of hops to another AS`,`Choosing which routes to advertise to neighbours`,`Limiting how much traffic an AS carries`,`Defining areas within a hierarchy`],2,`Import policy decides which paths to accept; export policy decides which routes to advertise to neighbouring ASes.`,`past`),$(`nc-bgp`,`What is the goal of hot-potato routing?`,[`To move messages to the target AS as cheaply as possible`,`To move messages to the target AS as quickly as possible`,`To move messages out of an AS as quickly as possible`,`To move messages according to the administrator policy`,`To move messages according to the NEXT-HOP attribute`],2,`Choose the local gateway with the least intra-domain cost – get the packet out of your AS as fast as possible, ignoring inter-domain cost.`,`past`),$(`nc-bgp`,`Which BGP message advertises a new path or withdraws an old one?`,[`OPEN`,`UPDATE`,`KEEPALIVE`,`NOTIFICATION`],1,`UPDATE advertises/withdraws paths. OPEN starts the session, KEEPALIVE keeps it alive (and ACKs OPEN), NOTIFICATION reports errors and closes it.`),$(`nc-bgp`,`Which BGP message reports errors and is used to close the connection?`,[`OPEN`,`UPDATE`,`KEEPALIVE`,`NOTIFICATION`],3,`NOTIFICATION reports errors in the previous message and is used to close the connection.`),$(`nc-bgp`,`BGP is a “path-vector” protocol. This means it advertises…`,[`link costs only`,`paths (lists of ASes) to destination prefixes`,`MAC addresses`,`distance vectors of hop counts`],1,`BGP peers advertise paths to destination network prefixes.`),$(`nc-bgp`,`The AS-PATH attribute is…`,[`the list of ASes through which the prefix advertisement has passed`,`the cost inside the local AS`,`the IP address of the destination host`,`the TCP port of the BGP session`],0,`AS-PATH lists the ASes the advertisement has passed through; NEXT-HOP identifies the internal router leading to the next-hop AS.`),$(`nc-bgp`,`When selecting among several routes to a destination, BGP considers FIRST…`,[`closest NEXT-HOP router`,`shortest AS-PATH`,`local preference (policy)`,`lowest MAC address`],2,`Order: local preference, shortest AS-PATH, closest NEXT-HOP (hot potato), then additional criteria.`),$(`nc-bgp`,`Router 1c learns path “AS2, AS3, X” from 2a and path “AS3, X” from 3a, with equal local preference. Which does it choose?`,[`AS2, AS3, X`,`AS3, X (shorter AS-PATH)`,`It uses both at random`,`Neither – it must use hot potato first`],1,`Local preference ties, so the shortest AS-PATH wins.`,`calc`),$(`nc-bgp`,`On the hot-potato slide router 2d reaches gateway 2a at OSPF cost 201 and 2c at cost 263. Which does it choose and why?`,[`2c, because it is directly connected to AS3`,`2a, because its intra-AS cost is lower (hot potato)`,`2c, because AS-PATH is shorter`,`2a, because eBGP prefers the lowest-numbered router`],1,`Hot potato picks the gateway with the least intra-domain cost (201 < 263), even though it means more AS hops.`,`calc`),$(`nc-bgp`,`BGP routers exchange messages over…`,[`a semi-permanent TCP connection`,`UDP datagrams`,`raw Ethernet frames`,`ICMP messages`],0,`A BGP session is a semi-permanent TCP connection between two peers.`),$(`nc-bgp`,`Which routers run both eBGP and iBGP?`,[`All routers in every AS`,`Gateway routers`,`Only backbone routers`,`Only hosts`],1,`Gateway routers learn routes via eBGP and pass them to internal routers via iBGP.`),$(`nc-bgp`,`Why do inter-AS and intra-AS use different routing approaches?`,[`Intra-AS is slower`,`Inter-AS is dominated by policy, intra-AS can focus on performance`,`Inter-AS uses link state only`,`Intra-AS cannot use hierarchy`],1,`Policy: inter-AS admins want control. Scale: hierarchy saves table size. Performance: intra-AS can focus on it; inter-AS policy may dominate.`),$(`nc-snmp`,`In SNMP, a managed device’s operational data is gathered into the…`,[`FIB`,`MIB`,`ARP table`,`RIB`],1,`Managed objects’ data is gathered in the Management Information Base (MIB).`),$(`nc-snmp`,`Which SNMP message lets a managed device tell the manager about an exceptional event?`,[`GetRequest`,`SetRequest`,`Response`,`Trap`],3,`A Trap is agent-to-manager, sent unprompted about an exceptional event.`),$(`nc-snmp`,`A SetRequest is sent…`,[`from agent to manager to report a fault`,`from manager to agent to set a MIB value`,`between two agents`,`from manager to manager`],1,`SetRequest: manager-to-agent, set a MIB value.`),$(`nc-snmp`,`The process on a managed device that communicates with the managing server is the…`,[`agent`,`controller`,`gateway`,`MIB`],0,`Each managed device runs an SNMP agent.`),$(`ll-intro`,`The link layer’s responsibility is to transfer a datagram…`,[`end to end between hosts`,`from one node to a physically adjacent node over a link`,`between autonomous systems`,`between processes`],1,`Link layer = hop-by-hop between adjacent nodes. End-to-end is the transport layer’s job.`),$(`ll-intro`,`A layer-2 packet is called a…`,[`segment`,`datagram`,`frame`,`message`],2,`Frames encapsulate datagrams at the link layer.`),$(`ll-intro`,`Where is the link layer implemented?`,[`Only in routers`,`In the network interface card / adapter of each host`,`Only in switches`,`In DNS servers`],1,`In every host, in the NIC (or on a chip): a mix of hardware, software and firmware.`),$(`ll-intro`,`Reliable delivery between adjacent nodes is seldom used on…`,[`wireless links`,`low bit-error links such as fibre`,`links with high error rates`,`satellite links`],1,`Low bit-error links don’t need it; wireless links with high error rates do.`),$(`ll-intro`,`On a half-duplex link, the nodes at both ends…`,[`can transmit but not at the same time`,`can transmit simultaneously`,`can only receive`,`must use TDMA`],0,`Half duplex: both ends can transmit, but not at the same time.`),$(`ll-errors`,`What is the CRC bit string for the data D = 11111 with the generator G = 101010?`,[`10000`,`10101`,`01010`,`01110`,`11010`],0,`G has 6 bits → r = 5. 11111·2⁵ = 1111100000. XOR G under each leading 1 until 5 bits remain: remainder 10000.`,`past`),$(`ll-errors`,`What is the CRC bit string for D = 10101010 with generator G = 111111?`,[`10101`,`01010`,`10100`,`01110`,`11010`],2,`r = 5. Appending 00000 and XORing G (111111) under each leading 1 leaves remainder 10100.`,`past`),$(`ll-errors`,`If the generator G is 101010, how many CRC bits are there?`,[`3`,`4`,`5`,`6`],2,`G has r+1 = 6 bits, so r = 5 CRC bits.`,`calc`),$(`ll-errors`,`G = 1001 and D = 10011111. What are the CRC bits R?`,[`110`,`101`,`011`,`001`],0,`r = 3. 10011111000 divided by 1001 (mod 2) leaves 110.`,`calc`),$(`ll-errors`,`G = 1001 and D = 10011100. What are the CRC bits R?`,[`110`,`101`,`011`,`111`],1,`r = 3. 10011100000 divided by 1001 (mod 2) leaves 101.`,`calc`),$(`ll-errors`,`Even parity: the data bits are 1011001. What should the parity bit be?`,[`0`,`1`],0,`There are four 1s already (even), so the parity bit is 0.`,`calc`),$(`ll-errors`,`A single parity bit can detect…`,[`any number of flipped bits`,`any odd number of flipped bits`,`only 2-bit errors`,`and correct any single-bit error`],1,`An odd number of flips changes the parity; an even number cancels out. It can’t correct anything.`),$(`ll-errors`,`Two-dimensional parity can…`,[`detect and correct single-bit errors`,`only detect errors, never correct`,`correct any burst error`,`detect only errors in parity bits`],0,`One failing row + one failing column pinpoint the flipped bit, so it can be corrected (forward error correction).`),$(`ll-errors`,`In a 2-D parity check exactly row 1 and column 1 fail. What does this show?`,[`A single flipped bit at (1,1), which can be corrected`,`Two flipped bits that cannot be corrected`,`Only the parity row is corrupted`,`No error`],0,`The intersection of the failing row and column is the flipped bit (problem-sheet Figure 3).`,`calc`),$(`ll-errors`,`The Internet checksum, as described in these slides, is used at…`,[`the link layer only`,`the transport layer only`,`every layer`,`the physical layer`],1,`The slides stress it’s used only at the transport layer; the link layer uses CRC.`),$(`ll-errors`,`In CRC, the receiver divides the received <D,R> by G. A non-zero remainder means…`,[`no error`,`an error was detected`,`the frame is a broadcast`,`R must be recomputed by the sender`],1,`Exactly divisible = no error detected; non-zero remainder = error detected.`),$(`ll-errors`,`CRC can detect all burst errors shorter than…`,[`r bits`,`r + 1 bits`,`16 bits`,`32 bits`],1,`All burst errors of fewer than r+1 bits are detected.`),$(`ll-errors`,`Which error-detection code is used by Ethernet and 802.11?`,[`Single parity bit`,`2-D parity`,`Internet checksum`,`CRC`],3,`CRC is widely used in practice, including Ethernet and 802.11 WiFi.`),$(`ll-mac`,`What is the maximum efficiency of slotted ALOHA with many nodes?`,[`About 18%`,`About 37%`,`About 50%`,`About 100%`],1,`1/e ≈ 0.37, achieved at p* = 1/N.`),$(`ll-mac`,`What is the maximum efficiency of pure (unslotted) ALOHA?`,[`About 18%`,`About 37%`,`About 50%`,`About 74%`],0,`1/(2e) ≈ 0.18, half of slotted ALOHA, because a frame can collide with any frame sent in [t0−1, t0+1].`),$(`ll-mac`,`For N nodes in slotted ALOHA, efficiency is maximised when each node transmits with probability p =`,[`1/e`,`1/2`,`1/N`,`N`],2,`On average exactly one node tries per slot.`),$(`ll-mac`,`In a 6-station TDMA LAN only stations 1, 3 and 4 have data. What happens to slots 2, 5 and 6?`,[`They are given to the active stations`,`They go idle`,`They are used for collisions`,`They are used for ACKs`],1,`TDMA slots are fixed per station; unused ones go idle (wasted).`),$(`ll-mac`,`Why can collisions still happen with CSMA?`,[`Nodes ignore the carrier`,`Propagation delay means nodes may not hear each other’s just-started transmission`,`Frames are too small`,`The channel is slotted`],1,`Distance and propagation delay determine the collision probability.`),$(`ll-mac`,`In Ethernet CSMA/CD, after the 3rd collision a node chooses K at random from…`,[`{0, 1, 2}`,`{0, 1, …, 7}`,`{0, 1, …, 15}`,`{0, 1, …, 1023}`],1,`After the m-th collision: K ∈ {0, 1, …, 2^m − 1}. For m = 3 that’s {0…7}.`,`calc`),$(`ll-mac`,`In CSMA/CD, after choosing K the node waits…`,[`K × 512 bit times`,`K seconds`,`K × 64 bytes`,`a fixed 512 bit times`],0,`The node waits K·512 bit times, then returns to sensing the channel.`),$(`ll-mac`,`Collision detection is easy in wired LANs but hard in wireless because…`,[`wireless frames are shorter`,`the received signal strength is much weaker than the local transmission strength`,`wireless is always full duplex`,`wireless uses TDMA`],1,`You can’t easily hear a collision while shouting over your own transmitter.`),$(`ll-mac`,`Which MAC protocol does 802.11 use?`,[`CSMA/CD`,`CSMA/CA`,`Token passing`,`Pure ALOHA`],1,`CSMA/CD was used in old shared Ethernet; CSMA/CA is used in 802.11.`),$(`ll-mac`,`Which “taking turns” protocol is used by Bluetooth?`,[`Token passing`,`Polling`,`Slotted ALOHA`,`FDMA`],1,`Bluetooth uses polling.`),$(`ll-mac`,`A common concern for both polling and token passing is…`,[`collisions`,`overhead, latency and a single point of failure`,`clock synchronisation`,`low efficiency at high load`],1,`Polling: polling overhead, latency, master failure. Token passing: token overhead, latency, token loss.`),$(`ll-mac`,`An ideal multiple access protocol gives each of M active nodes an average rate of…`,[`R`,`R/M`,`R/2`,`M·R`],1,`When M nodes want to transmit, each can send at an average rate R/M.`),$(`ll-mac`,`Which is NOT a random-access protocol?`,[`Slotted ALOHA`,`CSMA/CD`,`TDMA`,`CSMA`],2,`TDMA is channel partitioning.`),$(`ll-mac`,`CSMA/CD efficiency approaches 1 as…`,[`t_prop → ∞`,`t_prop → 0 (or t_trans → ∞)`,`the number of nodes → ∞`,`collisions increase`],1,`Short propagation delay or long frames make collisions rare relative to useful transmission.`),$(`ll-addr`,`What is the function of a MAC address?`,[`to move frames from one network-layer interface to another`,`to identify a network interface in a local subnet`,`to uniquely identify an IP address`,`to enable self-learning with IP address of network-connected switches`,`to forward frames between multiple different LANs`],1,`A MAC address is used locally to get a frame from one interface to another physically connected interface on the same subnet.`,`past`),$(`ll-addr`,`How long is a MAC address?`,[`32 bits`,`48 bits`,`64 bits`,`128 bits`],1,`48 bits (6 bytes), written in hex like 1A-2F-BB-76-09-AD.`),$(`ll-addr`,`An ARP query is sent to which Ethernet destination address?`,[`The target’s MAC`,`The router’s MAC`,`FF-FF-FF-FF-FF-FF`,`00-00-00-00-00-00`],2,`It is broadcast so every node on the LAN receives it; only the owner of the target IP replies.`),$(`ll-addr`,`How is an ARP reply sent?`,[`Broadcast to everyone`,`Directly (unicast) to the asker’s MAC`,`To the default router only`,`Via DNS`],1,`The owner replies to the asker’s MAC `,`connectionless and reliable`,`connection-oriented and unreliable`],1,`No handshaking and no ACKs/NAKs. Lost data is recovered only by higher layers (e.g. TCP).`),$(`ll-ethernet`,`The Ethernet preamble is used to…`,[`detect errors`,`synchronise receiver and sender clock rates`,`identify the destination`,`indicate the upper-layer protocol`],1,`7 bytes of 10101010 followed by 10101011.`),$(`ll-ethernet`,`The Ethernet Type field is used to…`,[`demultiplex up to the right network-layer protocol`,`check for errors`,`carry the VLAN ID`,`synchronise clocks`],0,`It indicates the higher-layer protocol (mostly IP).`),$(`ll-ethernet`,`An adapter receives a frame whose destination MAC is neither its own nor the broadcast address. It…`,[`passes the data up anyway`,`discards the frame`,`sends an ARP reply`,`floods it`],1,`Only matching or broadcast frames are passed up.`),$(`ll-ethernet`,`A frame arrives with a CRC error. The Ethernet receiver…`,[`drops the frame`,`sends a NAK`,`corrects the bits`,`forwards it anyway`],0,`Error detected → frame dropped. Ethernet doesn’t send NAKs.`),$(`ll-ethernet`,`Which Ethernet topology prevails today?`,[`Bus (coax)`,`Switched star`,`Token ring`,`Mesh with hubs`],1,`A link-layer switch in the centre; each spoke is its own collision domain.`),$(`ll-switch`,`A switch with an empty table receives a frame from A (on port 1) addressed to B. What does it do?`,[`Drops it`,`Floods it on all ports except 1 and learns A is on port 1`,`Sends it only to port 1`,`Sends an ARP request`],1,`B is unknown, so flood on all interfaces except the arriving one. It also learns A → port 1 from the source address.`,`calc`),$(`ll-switch`,`A self-learning switch builds its table from the ___ MAC address of incoming frames.`,[`source`,`destination`,`broadcast`,`router’s`],0,`It records sender/interface pairs from source addresses, and looks up the destination to forward.`),$(`ll-switch`,`A frame arrives whose destination is known to be on the same segment it arrived f -router vs centralised (controller + control agents)`]},{id:`a2`,mod:`A`,t:`Dijkstra (link state)`,l:[`N′={u}; D(v)=c(u,v) else ∞`,`loop: pick w∉N′ with min D(w); add to N′; for each neighbour v∉N′: D(v)=min(D(v), D(w)+c(w,v))`,`p(v)=predecessor · O(n²) (O(n log n) better) · used by OSPF`,`Result = forwarding table (first link on each path)`],hot:!0},{id:`a3`,mod:`A`,t:`Bellman-Ford (distance vector)`,l:[`dx(y) = min_v { c(x,v) + dv(y) } over neighbours v`,`send DV to neighbours when it changes · stops when no DV changes · used by RIP`],hot:!0},{id:`a4`,mod:`A`,t:`DV problems`,l:[`Good news fast, bad news slow → COUNT TO INFINITY (e.g. 44 iterations)`,`Poisoned reverse: if Z routes via Y to X, Z tells Y its distance to X = ∞`,`Fails for loops with more than 3 nodes`],hot:!0},{id:`a5`,mod:`A`,t:`LS vs DV`,l:[`LS: global info, O(n²), O(nE) msgs, oscillations (load-sensitive cost), each node computes own table`,`DV: neighbours only, loops/count-to-∞, wrong cost spreads through network`]},{id:`a6`,mod:`A`,t:`AS, intra vs inter`,l:[`AS = region (scale + admin autonomy) · gateway router = edge router linking to other AS`,`Intra-AS: one admin, performance; same protocol inside · Inter-AS: policy dominates`]},{id:`a7`,mod:`A`,t:`RIP vs OSPF`,l:[`RIP: DV, hop count, max 15, DV every 30 s`,`OSPF: LS + Dijkstra, floods LSAs to whole AS, directly over IP, authenticated, equal-cost multipath`,`OSPF areas: backbone + local areas; area border routers SUMMARISE their area; boundary routers → other ASes`,`IS-IS ≈ OSPF · IGRP = Cisco`],hot:!0},{id:`a8`,mod:`A`,t:`BGP`,l:[`Inter-AS, path vector, over TCP · eBGP = between GATEWAYS of neighbouring ASes · iBGP = spread inside AS`,`Messages: OPEN, UPDATE (advertise/withdraw), KEEPALIVE (also ACKs OPEN), NOTIFICATION (errors/close)`,`Route = prefix + attributes (AS-PATH, NEXT-HOP) · import/export policy`,`Selection: 1 local pref → 2 shortest AS-PATH → 3 closest NEXT-HOP (hot potato) → 4 other`],hot:!0},{id:`a9`,mod:`A`,t:`Hot potato`,l:[`Pick gateway with least INTRA-AS cost; get packet OUT of my AS ASAP; ignore inter-domain cost (2d → 2a: 201 < 263)`],hot:!0},{id:`a10`,mod:`A`,t:`SNMP`,l:[`Managing server · managed device + agent · MIB (data) · SMI (definition language)`,`Get/GetNext/GetBulk/Set (manager→agent), Response (agent→manager), Trap (agent→manager, exceptional event)`]},{id:`b1`,mod:`B`,t:`Link layer`,l:[`Frame = layer-2 packet · hop-by-hop between ADJACENT nodes · lives in the NIC`,`Services: framing/link access, reliable delivery (rare on low-error links), flow control, error detection/correction, half/full duplex`]},{id:`b2`,mod:`B`,t:`Parity`,l:[`Even parity = total # of 1s even (XOR of data bits) · single parity detects ODD # of flips only`,`2-D parity: detect + CORRECT 1-bit error (failing row ∩ failing column), detects any 2-bit error`,`Problem-sheet format x,y = column,row from 0`],hot:!0},{id:`b3`,mod:`B`,t:`Internet checksum`,l:[`16-bit words, one’s-complement sum (wrap carry), then flip bits · transport layer only`]},{id:`b4`,mod:`B`,t:`CRC`,l:[`r = len(G) − 1 · append r zeros to D · divide by G with XOR (mod 2) · R = remainder`,`Send <D,R> · receiver remainder ≠ 0 → error · detects bursts < r+1 bits · Ethernet, 802.11`,`Check: D=11111, G=101010 → 10000 · D=10101010, G=111111 → 10100`],hot:!0},{id:`b5`,mod:`B`,t:`MAC protocol families`,l:[`Channel partitioning: TDMA (slots), FDMA (bands) – idle slots wasted, 1/N share`,`Random access: ALOHA, slotted ALOHA, CSMA, CSMA/CD, CSMA/CA`,`Taking turns: polling (Bluetooth), token passing (FDDI) – overhead, latency, single point of failure`]},{id:`b6`,mod:`B`,t:`ALOHA`,l:[`Slotted: success = N·p·(1−p)^(N−1), best p = 1/N → 1/e ≈ 37%`,`Pure: collides with frames in [t0−1, t0+1] → 1/2e ≈ 18%`],hot:!0},{id:`b7`,mod:`B`,t:`CSMA/CD`,l:[`Listen before talk; collisions still happen (propagation delay)`,`CD: abort + jam signal; wired easy, wireless hard (→ CSMA/CA in 802.11)`,`Binary backoff: after m-th collision K ∈ {0…2^m −1}, wait K×512 bit ti
